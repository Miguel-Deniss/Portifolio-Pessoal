<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark px-4 bg-dark">
  <a class="navbar-brand fw-bold" href="index.html">Meu Portfólio</a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
      <li class="nav-item"><a class="nav-link" href="index.html#projetos">Projetos</a></li>
      <li class="nav-item"><a class="nav-link active" href="#">Contato</a></li>
    </ul>
  </div>
</nav>

<section class="container py-5">

  <h1 class="mb-4">Contato</h1>

  <main>
  <form id="formContato">
   <label for="nome">Nome:</label>
   <input
     type="text"
     id="nome"
     name="nome"
     required
     placeholder="Digite seu nome"
   />
   <label for="email">E-mail:</label>
   <input
     type="email"
     id="email"
     name="email"
     required
     placeholder="Digite seu E-mail"
   />
   <label for="mensagem">Mensagem:</label>
   <textarea
     name="mensagem"
     id="mensagem"
     required
     placeholder="Digite sua mensagem"
   ></textarea>
   <button type="submit" id="btnWhatsapp">Enviar</button>
 </form>
   
 <script src="script.js"></script>
</main>

</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
